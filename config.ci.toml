# ============================================================
#  Konfiguration für den automatischen Lauf auf GitHub Actions
#  KEINE Secrets hier eintragen! Client-ID und Secret kommen aus den
#  Repository-Secrets BLIZZARD_CLIENT_ID und BLIZZARD_CLIENT_SECRET.
#  Achtung: Das Repo ist öffentlich – alles in dieser Datei ist sichtbar.
# ============================================================

[blizzard]
region = "eu"
locale = "de_DE"
requests_per_second = 25

[realm]
slug = "dun-morogh"

[filter]
professions = []
tier_keywords = []
tier_exclude_keywords = ["Midnight", "Quel"]
category_keywords = []
only_known_recipes = false

[analysis]
ah_cut = 0.05
market_share = 0.2
history_days = 7
retention_days = 10         # kürzer als lokal, damit der Cache klein bleibt
only_recipe_items = false   # ALLE Items erfassen (auch Weltdrops/Transmog für den Farm-Modus)
max_gap_hours = 4
min_profit_gold = 1         # auch kleine Margen zeigen – die Masse macht's
top_n = 300
crafts_per_recipe = 10
farm_list_recipes = 20
competition_threshold = 40
min_auctions = 3
min_sold_per_day = 0.5
min_demand_hours = 12
demand_min_hours = 2.5        # Ab so vielen Stunden Verlauf werden Verkäufe/Tag angezeigt
easy_max_invest_gold = 5000
easy_min_sold_per_day = 2
capital_threshold_gold = 50000
raw_per_group = 30          # Einträge pro Rohstoff-Gruppe
transmog_limit = 150
flip_min_discount = 0.15    # Schnäppchen: mindestens 15 % unter dem 7-Tage-Schnitt
flip_min_sold_per_day = 3

[player]
# Tätigkeiten, die du ohne Sammelberuf machen kannst (für die Markierung "für dich machbar")
activities = ["Stoff", "Verzauberung", "Fleisch & Fisch", "Elementar"]

[goal]
label = "Midnight (Basisedition)"
price_eur = 49.99
balance_per_token_eur = 12.99
current_gold = 0            # optional: dein aktuelles Gold, dann zeigt der Bericht den Fortschritt

# Farm-Logbuch (optional): nach einer Session hier eintragen -> echtes Gold pro Stunde pro Spot
# [[farm_log]]
# spot = "stormsong-glazer"   # id aus farmspots.json
# minutes = 60
# gold = 15000                # Gesamtwert der Beute (AH-Preise) + Rohgold

[vendor_prices]
