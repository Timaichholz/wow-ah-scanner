name: AH-Scan

# Sicherheit: Der Workflow startet NUR per Zeitplan, manuell durch den Repo-Besitzer oder durch sich selbst
# (Kette, siehe letzter Schritt). Bewusst KEIN "pull_request"-Trigger -> fremde Forks/PRs können ihn nie
# mit den Secrets ausführen.
on:
  schedule:
    - cron: "17,47 * * * *"   # zweimal pro Stunde (UTC) – fällt ein Lauf aus, fängt der nächste ihn auf
  workflow_dispatch:        # manuell starten über "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # nur, damit der Lauf am Ende den nächsten Lauf dieses Workflows starten kann

concurrency:
  group: ah-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # kein GitHub-Token auf dem Runner hinterlassen

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Gespeicherten Zustand laden (Datenbank, Rezepte, letzter Snapshot)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: ahstate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ahstate-

      - name: Scan und Bericht
        env:
          AHSCANNER_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          AHSCANNER_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python -m ahscanner --config config.ci.toml ci

      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: ahstate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bericht als Download sichern
        uses: actions/upload-artifact@v4
        with:
          name: bericht
          path: output/site
          retention-days: 3

      - name: Webseite vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

      - name: Auf GitHub Pages veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4

  # GitHubs Zeitpläne lassen Läufe oft ausfallen. Deshalb startet jeder Lauf nach einer Wartezeit
  # den nächsten selbst (Kette). Der Zeitplan oben bleibt als Sicherheitsnetz, falls die Kette reißt.
  # Läuft oder wartet bereits ein anderer Lauf, wird KEIN neuer gestartet -> nie zwei Ketten parallel.
  # Eigener Job: Der Scan-Job ist so sofort abgeschlossen (Ergebnis/Hinweise direkt sichtbar),
  # und dieser Job hat keinen Zugriff auf die Blizzard-Secrets.
  chain:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
    steps:
      - name: Nächsten Lauf planen (in ca. 45 Minuten)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          sleep 2700
          others=$(gh api "repos/$REPO/actions/workflows/scan.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $SELF) | select(.status != \"completed\")] | length")
          if [ "$others" = "0" ]; then
            gh workflow run scan.yml --ref main -R "$REPO" && echo "Nächster Lauf gestartet."
          else
            echo "Es läuft oder wartet bereits ein anderer Lauf ($others) – keine zusätzliche Kette."
          fi
